name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev xdg-utils
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Build Qt-free Windows depot engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-depotkit.ps1
      - name: Verify Windows depot engine without Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AZDL_TEST_DEPOTKIT = Join-Path $pwd 'target/depotkit-runtime/depotkit.dll'
          cargo test -p azdl --lib bundled_windows_engine_loads_without_qt_and_validates_requests -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Windows depot engine ABI check failed' }
      - name: Lint Rust workspace
        run: cargo clippy --all-targets -- -D warnings
      - name: Build desktop binary
        run: cargo build -p azdl-desktop
