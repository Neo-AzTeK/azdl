[workspace]
members = [
    ".",
    "src-tauri",
]
default-members = [
    ".",
    "src-tauri",
]

[package]
name = "azdl"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8.4"
base64 = "0.22.1"
crc32fast = "1.5"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
