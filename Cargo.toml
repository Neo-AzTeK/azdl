[workspace]
members = [
    ".",
    "src-tauri",
]
default-members = [
    ".",
    "src-tauri",
]

[package]
name = "azdl"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8.4"
base64 = "0.22.1"
bytes = "1"
crc32fast = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
steamroom = "0.3"
steamroom-client = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
